name: Windows release

on:
  push:
    branches: [codex/release-v0.1.3]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit or tag to release
        default: main
        required: true

permissions:
  contents: write

concurrency:
  group: raccoon-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and caption operations
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and verify editor workflow
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build unpackaged Windows app
        run: |
          npm run prepare:tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron-builder/cli.js --win dir --x64 --publish never
      - name: Verify full distributed editor workflow
        shell: pwsh
        env:
          TEST_PACKAGED: "1"
        run: |
          npm run test:e2e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify translation and download improvements
        shell: pwsh
        env:
          TEST_PACKAGED: "1"
        run: |
          npm run test:translation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:download
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test distributed app
        shell: pwsh
        run: |
          @'
          const { _electron: electron } = require('playwright');
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const root = process.cwd();
          (async () => {
            const profile = path.join(root, '.tools', 'release-profile');
            await fs.mkdir(profile, { recursive: true });
            const app = await electron.launch({
              executablePath: path.join(root, 'release', 'win-unpacked', 'Raccoon Studio.exe'),
              args: ['--user-data-dir=' + profile],
              env: Object.fromEntries(Object.entries(process.env).filter(([key]) => key !== 'ELECTRON_RUN_AS_NODE')),
            });
            try {
              const page = await app.firstWindow();
              await page.getByRole('button', { name: 'Open local video', exact: true }).waitFor();
              assert.equal(await page.title(), 'Raccoon Studio');
              await page.waitForFunction(() => document.querySelector('img.logo')?.naturalWidth > 0);
              const settings = await page.evaluate(() => window.studio.call('settings'));
              for (const key of ['ffmpeg', 'ffprobe', 'ytdlp', 'whisper']) {
                assert.ok(settings[key].includes('resources'), key + ' must be bundled');
                await fs.access(settings[key]);
              }
              execFileSync(settings.ytdlp, ['--version'], { windowsHide: true });
              execFileSync(settings.whisper, ['--help'], { windowsHide: true, stdio: 'pipe' });
              await app.evaluate(({ dialog }, file) => {
                dialog.showOpenDialog = async () => ({ canceled: false, filePaths: [file] });
              }, path.join(root, '.tools', 'test-work', 'e2e', 'real video & audio.mp4'));
              await page.getByRole('button', { name: 'Open local video', exact: true }).click();
              await page.waitForFunction(() => document.querySelector('video')?.readyState >= 2);
              await page.getByRole('button', { name: 'Play', exact: true }).click();
              await page.waitForFunction(() => document.querySelector('video').currentTime > 0.2);
              await page.getByRole('button', { name: 'Pause', exact: true }).click();
              await page.waitForFunction(() => !document.querySelector('.wave-label'));
              console.log('PASS: distributed title, icon, bundled tools, playback and waveform');
            } finally { await app.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          '@ | Set-Content -LiteralPath .tools/release-smoke.cjs -Encoding utf8
          node .tools/release-smoke.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create Windows archive and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $asset = "Raccoon-Studio-$version-win-x64.zip"
          Copy-Item -LiteralPath README.md,WHISPERX_SETUP.md,LICENSE -Destination release/win-unpacked
          New-Item -ItemType Directory -Path release/win-unpacked/scripts -Force | Out-Null
          Copy-Item -LiteralPath scripts/setup-whisperx.ps1,scripts/requirements-whisperx.txt -Destination release/win-unpacked/scripts
          Compress-Archive -Path release/win-unpacked -DestinationPath "release/$asset" -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath "release/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV
          "RELEASE_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          - Translation now uses surrounding captions, your terminology, and optional meaning checks.
          - Save glossaries globally or export and import them between projects.
          - Choose video quality before downloading.
          - Video preview shows translated subtitles when available.
          - Completed translation drafts are kept if a meaning check fails.
          - Fixed glossary terms carrying over between languages and outdated warnings after splitting or merging captions.
          '@ | Set-Content -LiteralPath .tools/release-notes.md -Encoding utf8
          gh release create "v$env:RELEASE_VERSION" "release/$env:RELEASE_ASSET" release/SHA256SUMS.txt --repo "${{ github.repository }}" --target $env:RELEASE_COMMIT --title "Raccoon Studio $env:RELEASE_VERSION" --notes-file .tools/release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-verification
          path: |
            verification.png
            workflow-verification.png
          if-no-files-found: ignore
